name: iOS 1.7.19 SDK validation
on:
  push:
    branches: ['codex/ios-1.7.19']
    paths: ['OmniDownloader-iOS/**', '.github/workflows/ios-1.7.19.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned native package
        run: |
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -project OmniDownloader-iOS/OmniDownloader.xcodeproj -scheme OmniDownloader -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" | tee resolve.log
      - name: Run iPhone native and UI tests
        shell: bash
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcodebuild test -project OmniDownloader-iOS/OmniDownloader.xcodeproj -scheme OmniDownloader -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/ios-build" -resultBundlePath "$RUNNER_TEMP/iOS-tests.xcresult" CODE_SIGNING_ALLOWED=NO | tee tests.log
      - name: Build ARM64 unsigned IPA
        if: success()
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project OmniDownloader-iOS/OmniDownloader.xcodeproj -scheme OmniDownloader -configuration Release -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/ios-release" CODE_SIGNING_ALLOWED=NO | tee release.log
          mkdir -p output/Payload
          cp -R "$RUNNER_TEMP/ios-release/Build/Products/Release-iphoneos/OmniDownloader.app" output/Payload/
          cd output && zip -qry OmniDownloader-1.7.19-unsigned.ipa Payload && rm -r Payload
          shasum -a 256 OmniDownloader-1.7.19-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniDownloader-iOS-1.7.19
          path: |
            output/*
            *.log
            ${{ runner.temp }}/iOS-tests.xcresult
          retention-days: 14
